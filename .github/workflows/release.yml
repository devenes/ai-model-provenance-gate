name: Release Packaging

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: Cross-Platform Build & Checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.27.3
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Run full verification suite
        run: |
          make fmt-check
          make vet
          shellcheck scripts/*.sh
          make test-race
          make e2e

      - name: Package cross-platform release archives
        run: make release-artifacts

      - name: Verify release manifest and checksums
        run: |
          test -f dist/checksums.txt
          test -f dist/SHA256SUMS
          test -f dist/manifest.json
          (cd dist && sha256sum -c checksums.txt)

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
